<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Flight Leader Dashboard</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="container">

    <h1>FULL BRIGHT COLLEGE</h1>

    <h2>PHILIPPINE AIR FORCE ROTC</h2>

    <hr>

    <h2 id="flightName">

        Flight Leader

    </h2>

    <hr>

    <label>

        Training Day

    </label>

    <select id="trainingDay">

        <option>Training Day 1</option>
        <option>Training Day 2</option>
        <option>Training Day 3</option>
        <option>Training Day 4</option>
        <option>Training Day 5</option>
        <option>Training Day 6</option>
        <option>Training Day 7</option>
        <option>Training Day 8</option>
        <option>Training Day 9</option>
        <option>Training Day 10</option>
        <option>Training Day 11</option>
        <option>Training Day 12</option>
        <option>Training Day 13</option>
        <option>Training Day 14</option>
        <option>Training Day 15</option>

    </select>

    <br><br>

    <label>

        Training Topic

    </label>

    <input
    type="text"
    id="trainingTopic"
    readonly>

    <br><br>

    <label>

        Attendance Window

    </label>

    <input
    type="text"
    id="attendanceWindow"
    readonly>

    <hr>

    <div class="stats">

        <div>

            <h3>Total Strength</h3>

            <h2 id="totalStrength">

                0

            </h2>

        </div>

        <div>

            <h3>Total Present</h3>

            <h2 id="totalPresent">

                0

            </h2>

        </div>

        <div>

            <h3>Total Absent</h3>

            <h2 id="totalAbsent">

                0

            </h2>

        </div>

    </div>

    <hr>

    <button
    class="btn"
    onclick="openAttendanceSpreadsheet()">

        📄 OPEN ATTENDANCE SPREADSHEET

    </button>

    <br><br>

    <button
    class="btn"
    onclick="refreshDashboard()">

        🔄 REFRESH ATTENDANCE

    </button>

    <br><br>

    <button
    class="btn logoutBtn"
    onclick="logoutFlightLeader()">

        LOGOUT

    </button>

</div>

<script src="js/flight-dashboard.js"></script>

</body>

</html>
