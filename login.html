<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadet Login</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* ======================================================
   STUDENT NAME INPUT GUIDE
   ====================================================== */

#studentName::placeholder {
    color: #777;
    opacity: 0.5;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo-area">

<img src="images/school-logo.jpg" class="logo">

<img src="images/rotc-logo.png" class="logo">

</div>

<h1>CADET LOGIN</h1>

<p>Philippine Air Force ROTC</p>

<input
type="text"
id="studentID"
placeholder="Student Number"
>

<input
type="text"
id="studentName"
placeholder="Last Name, First Name Middle Initial"
autocomplete="name"
>

<button
class="btn"
onclick="loginStudent()"
>

LOGIN

</button>

<a
href="index.html"
class="backBtn"
>

← Back

</a>

<p id="error"></p>

</div>

<script src="js/app.js"></script>

</body>

</html>
