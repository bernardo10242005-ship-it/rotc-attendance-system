<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Cadet Login</title>

<link
rel="stylesheet"
href="css/style.css"
>


<style>

/* ======================================================
   STUDENT NAME PLACEHOLDER GUIDE
   ====================================================== */

#studentName::placeholder {

    color: #777;

    opacity: 0.5;

}

</style>

</head>


<body>


<div class="login-card">


    <!-- ==================================================
         LOGOS
         ================================================== -->

    <div class="logo-area">

        <img
        src="images/school-logo.jpg"
        class="logo"
        >

        <img
        src="images/rotc-logo.png"
        class="logo"
        >

    </div>


    <!-- ==================================================
         TITLE
         ================================================== -->

    <h1>
        CADET LOGIN
    </h1>


    <p>
        Philippine Air Force ROTC
    </p>


    <!-- ==================================================
         STUDENT NUMBER
         ================================================== -->

    <input
    type="text"
    id="studentID"
    placeholder="Student Number"
    autocomplete="off"
    >


    <!-- ==================================================
         STUDENT NAME
         ================================================== -->

    <input
    type="text"
    id="studentName"
    placeholder="Last Name, First Name Middle Initial"
    autocomplete="name"
    >


    <!-- ==================================================
         LOGIN BUTTON
         ================================================== -->

    <button
    class="btn"
    onclick="loginStudent()"
    >

        LOGIN

    </button>


    <!-- ==================================================
         BACK BUTTON
         ================================================== -->

    <a
    href="index.html"
    class="backBtn"
    >

        ← Back

    </a>


    <!-- ==================================================
         ERROR / STATUS MESSAGE
         ================================================== -->

    <p id="error"></p>


</div>


<!-- ======================================================
     STUDENT LOGIN JAVASCRIPT
     ====================================================== -->

<script
src="js/app.js"
></script>


</body>

</html>
