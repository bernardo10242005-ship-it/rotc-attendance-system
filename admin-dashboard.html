<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FBC ROTC Command Center</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <div class="logo-area">

        <img src="images/school-logo.jpg" class="logo">

        <img src="images/rotc-logo.png" class="logo">

    </div>

    <h1>FULL BRIGHT COLLEGE</h1>

    <h2>ROTC COMMAND CENTER</h2>

    <p>Philippine Air Force Reserve Command</p>

    <hr>

    <h2>Attendance Control</h2>

    <label>Attendance Status</label>

    <select id="attendanceStatus">

        <option value="OPEN">🟢 OPEN</option>

        <option value="CLOSED">🔴 CLOSED</option>

    </select>

    <br><br>

    <label>Training Day</label>

    <input
    type="text"
    id="trainingDay"
    placeholder="Example: Training Day 1">

    <br><br>

    <label>Training Topic</label>

    <input
    type="text"
    id="trainingTopic"
    placeholder="Example: Military Courtesy">

    <br><br>

    <label>Attendance Start Time</label>

    <input
    type="time"
    id="startTime">

    <br><br>

    <label>Attendance End Time</label>

    <input
    type="time"
    id="endTime">

    <br><br>

    <button
    class="btn"
    onclick="saveSettings()">

        💾 SAVE SETTINGS

    </button>

    <hr>

    <h2>Training Files</h2>

    <button
    class="btn"
    onclick="openTrainingFiles()">

        📁 OPEN ROTC TRAINING FILES

    </button>

    <hr>

    <h2>Flight Leader Module</h2>

    <button
    class="btn"
    onclick="window.location.href='flight-login.html'">

        👥 FLIGHT LEADER LOGIN

    </button>

    <hr>

    <button
    class="btn logoutBtn"
    onclick="logoutAdmin()">

        🚪 LOGOUT

    </button>

</div>

<script src="js/admin-login.js"></script>

</body>

</html>
